spring:
  application:
    name: admin-api

  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/kkutudio_admin}
    username: ${ADMIN_DB_USERNAME:admin}
    password: ${ADMIN_DB_PASSWORD:admin}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  port: ${ADMIN_API_PORT:8080}
  servlet:
    context-path: /admin-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
